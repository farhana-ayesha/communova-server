services:
  - type: web
    name: communova-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: communova
      - key: CLIENT_ORIGIN
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: JWT_AUDIENCE
        value: communova-api
